name: kb_search
mode: builtin
activated_tools: null

config:
  # Embedding configuration
  #
  embedding:
    backend: openai
    model: ${oc.env:UTU_EMBEDDING_MODEL}
    api_key: ${oc.env:UTU_EMBEDDING_API_KEY}
    base_url: ${oc.env:UTU_EMBEDDING_URL}
    dimensions: 1024
    batch_size: 10

  # Reranker configuration
  reranker:
    backend: openai
    model: ${oc.env:UTU_RERANKER_MODEL}
    api_key: ${oc.env:UTU_RERANKER_API_KEY}
    base_url: ${oc.env:UTU_RERANKER_URL}

  # Vector store configuration
  vector_store:
    backend: chroma
    persist_directory: ${oc.env:VECTOR_STORE_PATH}
    distance_metric: cosine
